name: iOS CI/CD - Taiatari Game

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Default Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install CocoaPods
        run: |
          pod install

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Create Archive Directory
        run: mkdir -p build

      - name: Build and Archive
        run: |
          xcodebuild -workspace taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/taiatarigame.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     CODE_SIGN_STYLE="Automatic"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/taiatarigame.xcarchive \
                     -exportPath $PWD/build/output \
                     -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: src/build/output/taiatarigame.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
