name: iOS Build and Archive (Auto with Manual Fallback)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd src
          if [ -f "Gemfile" ]; then
            bundle install
            bundle exec pod install
          elif [ -f "Podfile" ]; then
            pod install
          fi

      - name: Create API Key File from Secret
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Try Build with Automatic Signing
        id: auto-build
        continue-on-error: true
        run: |
          cd src
          mkdir -p taiatarigame.xcodeproj/xcshareddata/xcschemes/
          
          xcodebuild -workspace taiatarigame.xcworkspace \
            -scheme taiatarigame \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/taiatarigame.xcarchive" \
            clean archive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE="Automatic" \
            DEVELOPMENT_TEAM="JACG2JJ596" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Set up temporary Keychain and Import Certificate (Fallback)
        if: steps.auto-build.outcome == 'failure'
        run: |
          echo "Automatic signing failed. Falling back to manual signing..."
          KEYCHAIN_PASS="temp_password"
          security default-keychain -s login.keychain
          security delete-keychain build.keychain || true

          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -A
          security set-key-partition-list -S apple-tor:,apple: -s -k "$KEYCHAIN_PASS" build.keychain

      - name: Install Provisioning Profile (Fallback)
        if: steps.auto-build.outcome == 'failure'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > profile.mobileprovision
          UUID=$(grep -a -A 1 "UUID" profile.mobileprovision | grep -o "[-A-Z0-9]\{36\}" | head -n 1)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build and Archive with Manual Signing (Fallback)
        if: steps.auto-build.outcome == 'failure'
        run: |
          cd src
          xcodebuild -workspace taiatarigame.xcworkspace \
            -scheme taiatarigame \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/taiatarigame.xcarchive" \
            clean archive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="JACG2JJ596" \
            PROVISIONING_PROFILE_SPECIFIER="jp.soni08.taiatarigame" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
