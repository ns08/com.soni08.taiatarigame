name: Build and Archive iOS App

on:
  push:
    branches:
      - main  # 必要に応じてブランチを変更してください

jobs:
  build:
    name: Build and Archive for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          pod install

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Create Archive Directory
        run: |
          mkdir -p build

      - name: Build and Archive
        run: |
          xcodebuild -workspace taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/taiatarigame.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     CODE_SIGN_STYLE="Automatic" \
                     DEVELOPMENT_TEAM="JACG2JJ596" \
                     -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
                     -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taiatarigame-archive
          path: build/taiatarigame.xcarchive

