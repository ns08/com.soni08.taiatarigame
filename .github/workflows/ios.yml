name: iOS Build with xcodebuild

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create API Key File from Secret
        run: |
          mkdir -p private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive App
        run: |
          xcodebuild -workspace YourApp.xcworkspace \
            -scheme YourAppScheme \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/YourApp.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="作成した配信用プロファイル名"

      - name: Export Archive (IPA)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/YourApp.xcarchive \
            -exportPath $PWD/build/output \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_$ASC_KEY_ID.p8"
