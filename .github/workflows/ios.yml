name: iOS Build and Archive (PWABuilder / Automatic Signing)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd src
          if [ -f "Gemfile" ]; then
            bundle install
            bundle exec pod install
          elif [ -f "Podfile" ]; then
            pod install
          fi

      - name: Create API Key File from Secret
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Build and Archive
        run: |
          cd src
          mkdir -p taiatarigame.xcodeproj/xcshareddata/xcschemes/
          
          xcodebuild -workspace taiatarigame.xcworkspace \
            -scheme taiatarigame \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/taiatarigame.xcarchive" \
            archive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE="Automatic" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="JACG2JJ596" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
