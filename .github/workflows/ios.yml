name: iOS Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Default Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods
        run: |
          if [ -f "src/Podfile" ]; then
            cd src
            pod install
          fi

      - name: Setup App Store Connect API Key
        uses: apple-actions/import-app-store-connect-api-key@v1
        with:
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-content: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Create Archive Directory
        run: mkdir -p build

      - name: Build and Archive
        run: |
          cd src
          xcodebuild -workspace taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/taiatarigame.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     CODE_SIGN_STYLE="Automatic" \
                     DEVELOPMENT_TEAM="JACG2JJ596"
