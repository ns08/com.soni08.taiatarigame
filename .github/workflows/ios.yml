name: Build and Sign with Local Files

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 一時的なキーチェーンを作成
      - name: Set up keychain
        run: |
          keychain_path=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          echo "KEYCHAIN_PATH=$keychain_path" >> $GITHUB_ENV

      # 2. リポジトリ内の .p12 ファイルを直接インポート
      - name: Import Certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        run: |
          cert_path="certs/certificate.p12"
          security import "$cert_path" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-todo:,apple: -s -k "" "$KEYCHAIN_PATH"

      # 3. リポジトリ内のプロファイルをシステムに配置
      - name: Import Provisioning Profile
        run: |
          profile_path="certs/build_profile.mobileprovision"
          
          # プロファイルからUUIDを自動抽出し、その名前で所定のフォルダにコピー
          uuid=$(grep -a -A 1 '<key>UUID</key>' "$profile_path" | tail -n 1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      # 4. Xcodeプロジェクトのビルドとアーカイブ
      - name: Build and Archive
        run: |
          xcodebuild -project src/taiatarigame.xcodeproj \
                     -scheme taiatarigame \
                     -sdk iphoneos \
                     -configuration Release \
                     archive \
                     -archivePath $RUNNER_TEMP/taiatarigame.xcarchive \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="com.soni08.taiatarigame" \
                     DEVELOPMENT_TEAM="JACG2JJ596"

      # 5. .ipaファイルに書き出し
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/taiatarigame.xcarchive \
                     -exportPath $RUNNER_TEMP/output \
                     -exportOptionsPlist ExportOptions.plist

      # 6. TestFlight へ自動アップロード（APIキーを設定している場合）
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/output/taiatarigame.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}