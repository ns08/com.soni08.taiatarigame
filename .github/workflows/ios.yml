name: Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. App Store Connect APIキーの配置
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 3. CocoaPodsの依存関係インストール
      # srcフォルダ内のPodfileを元にセットアップを実行します
      - name: Install Pods
        run: |
          pod install
        working-directory: ./src

      # 4. Xcodeアーカイブの作成（ビルド実行）
      # srcフォルダ内のワークスペースと英字のスキーム名を指定します
      - name: Build Xcode Archive
        run: |
          xcodebuild -workspace src/taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 5. IPAファイルの書き出し（パッケージ化）
      # srcフォルダ内にある既存の exportOptions.plist を指定します
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportPath build/exported \
                     -exportOptionsPlist src/exportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 6. TestFlight (App Store Connect) へアップロード
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file build/exported/taiatarigame.ipa \
                       --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                       --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
