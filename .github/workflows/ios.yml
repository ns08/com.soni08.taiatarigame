name: iOS Build and Archive

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd src
          if [ -f "Gemfile" ]; then
            bundle install
            bundle exec pod install
          elif [ -f "Podfile" ]; then
            pod install
          fi

      - name: Create API Key File from Secret
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/appstore_profile.mobileprovision
          echo "Installed provisioning profile:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true

      - name: Import signing assets
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Determine CODE_SIGN_IDENTITY
        run: |
          CID=$(security find-identity -p codesigning -v | awk -F\" '/Apple Distribution/ {print $2; exit}')
          if [ -z "$CID" ]; then
            CID=$(security find-identity -p codesigning -v | awk -F\" '{print $2; exit}')
          fi
          echo "Detected CODE_SIGN_IDENTITY: $CID"
          echo "CODE_SIGN_IDENTITY=$CID" >> $GITHUB_ENV

      - name: Debug workspace contents
        run: |
          cd src
          pwd
          echo "== ls -la src =="
          ls -la
          echo "== ls -la workspace/project =="
          ls -la taiatarigame.xcworkspace || true
          ls -la taiatarigame.xcodeproj/xcshareddata/xcschemes || true
          echo "== xcodebuild -version =="
          xcodebuild -version
          echo "== xcodebuild -list =="
          xcodebuild -list -workspace taiatarigame.xcworkspace || true

      - name: Build and Archive (signed with provisioning profile)
        run: |
          set -o pipefail
          cd src
          echo "Using CODE_SIGN_IDENTITY=${{ env.CODE_SIGN_IDENTITY }}"
          # Do not set PROVISIONING_PROFILE / PROVISIONING_PROFILE_SPECIFIER globally (breaks Pods targets).
          xcodebuild -workspace taiatarigame.xcworkspace \
            -scheme taiatarigame \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/taiatarigame.xcarchive" \
            clean archive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="JACG2JJ596" \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY }}" \
            2>&1 | tee xcodebuild.log
        continue-on-error: true

      - name: Upload xcodebuild log
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: src/xcodebuild.log
