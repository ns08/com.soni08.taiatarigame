name: Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js環境のセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './src/package-lock.json' # src内のロックファイルを監視

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: npm ci
        working-directory: ./src

      # 4. Webアプリ（PWA）のビルド
      # package.jsonのscriptsにある通常のWebビルドコマンドを実行させます
      - name: Build Web App
        run: npm run build
        working-directory: ./src
        continue-on-error: true # もし純粋なHTML/JSのみでbuildコマンドがない場合はスキップするため

      # 5. Capacitorの同期（iOSネイティブコードの生成）
      - name: Capacitor Sync
        run: npx cap sync ios
        working-directory: ./src

      # 6. App Store Connect APIキーの配置
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 7. CocoaPodsの依存関係インストール
      - name: Install Pods
        run: |
          cd ios/App
          pod install
        working-directory: ./src

      # 8. Xcodeアーカイブの作成（ビルド実行）
      - name: Build Xcode Archive
        run: |
          xcodebuild -workspace src/ios/App/App.xcworkspace \
                     -scheme App \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 9. IPAファイルの書き出し（リポジトリ内の exportOptions.plist を使用）
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportPath build/exported \
                     -exportOptionsPlist src/exportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 10. TestFlight (App Store Connect) へアップロード
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file build/exported/App.ipa \
                       --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                       --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
