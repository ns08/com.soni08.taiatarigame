name: iOS App Store Upload Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd src
          if [ -f "Gemfile" ]; then
            bundle install
            bundle exec pod install
          elif [ -f "Podfile" ]; then
            pod install
          fi

      - name: Create API Key File from Secret
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/appstore_profile.mobileprovision
          chmod 644 ~/Library/MobileDevice/Provisioning\ Profiles/appstore_profile.mobileprovision

      - name: Import signing assets
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Check Keychain Identities
        run: |
          security find-identity -p codesigning -v

      - name: Determine CODE_SIGN_IDENTITY
        run: |
          CID=$(security find-identity -p codesigning -v | awk -F\" '/Apple Distribution/ {print $2; exit}')
          if [ -z "$CID" ]; then
            CID=$(security find-identity -p codesigning -v | awk -F\" '{print $2; exit}')
          fi
          echo "Detected CODE_SIGN_IDENTITY: $CID"
          echo "CODE_SIGN_IDENTITY=$CID" >> $GITHUB_ENV

      - name: Build and Archive (iPhone Only)
        run: |
          set -o pipefail
          cd src
          xcodebuild -workspace taiatarigame.xcworkspace \
            -scheme taiatarigame \
            -sdk iphoneos \
            -configuration Release \
            TARGETED_DEVICE_FAMILY="1" \
            IPHONEOS_DEPLOYMENT_TARGET="15.0" \
            -archivePath "$RUNNER_TEMP/taiatarigame.xcarchive" \
            clean archive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="JACG2JJ596" \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY }}" \
            2>&1 | tee xcodebuild.log

      - name: Export IPA
        run: |
          cd src
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/taiatarigame.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            2>&1 | tee export.log

      - name: Upload to App Store Connect (API Key)
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/taiatarigame.ipa" \
            -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --output-format json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/xcodebuild.log
            src/export.log
          retention-days: 90
