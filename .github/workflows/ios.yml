name: iOS Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Default Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods
        run: |
          if [ -f "src/Podfile" ]; then
            cd src
            pod install
          fi

      - name: Setup App Store Connect API Key File
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Create Archive Directory
        run: mkdir -p build

      - name: Build and Archive
        run: |
          cd src
          xcodebuild -workspace taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $PWD/build/taiatarigame.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     CODE_SIGN_STYLE="Automatic" \
                     DEVELOPMENT_TEAM="JACG2JJ596" \
                     -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
                     -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
