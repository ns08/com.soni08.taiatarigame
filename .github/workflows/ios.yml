name: Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. App Store Connect APIキーの配置
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # 3. CocoaPodsの依存関係インストール
      - name: Install Pods
        run: |
          pod install
        working-directory: ./src

      # 4. Xcodeアーカイブの作成（ビルド実行）
      # IPHONEOS_DEPLOYMENT_TARGET=15.0 を指定してiOS 15以降に完全対応させます
      - name: Build Xcode Archive
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: "JACG2JJ596"
        run: |
          sed -i '' "s/DevelopmentTeam = \"\";/DevelopmentTeam = ${TEAM_ID};/g" src/taiatarigame.xcodeproj/project.pbxproj
          sed -i '' "s/DevelopmentTeam = .*/DevelopmentTeam = ${TEAM_ID};/g" src/taiatarigame.xcodeproj/project.pbxproj

          xcodebuild -workspace src/taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID $KEY_ID \
                     -authenticationKeyIssuerID $ISSUER_ID \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
                     CODE_SIGN_STYLE="Automatic" \
                     DEVELOPMENT_TEAM="$TEAM_ID" \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0

      # 5. 自動署名用の ExportOptions.plist を新規作成
      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > src/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>JACG2JJ596</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      # 6. IPAファイルの書き出し（パッケージ化）
      # ここでも deployment target を15.0に揃えます
      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: "JACG2JJ596"
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportPath build/exported \
                     -exportOptionsPlist src/exportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID $KEY_ID \
                     -authenticationKeyIssuerID $ISSUER_ID \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
                     CODE_SIGN_STYLE="Automatic" \
                     DEVELOPMENT_TEAM="$TEAM_ID" \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0

      # 7. TestFlight (App Store Connect) へアップロード
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file build/exported/taiatarigame.ipa \
                       --apiKey $KEY_ID \
                       --apiIssuer $ISSUER_ID
