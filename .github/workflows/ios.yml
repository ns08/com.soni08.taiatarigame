name: Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. App Store Connect APIキーの配置
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # 3. CocoaPodsの依存関係インストール
      - name: Install Pods
        run: |
          pod install
        working-directory: ./src

      # 4. 内部設定（Info.plist / プロジェクトファイル）の自動修正
      # バージョンアップ、画面向きの追加、衝突を避けるためのID個別書き換えを行います
      - name: Fix App Metadata and Settings
        run: |
          # ターゲットチームIDの設定
          sed -i '' "s/DevelopmentTeam = \"\";/DevelopmentTeam = JACG2JJ596;/g" src/taiatarigame.xcodeproj/project.pbxproj
          sed -i '' "s/DevelopmentTeam = .*/DevelopmentTeam = JACG2JJ596;/g" src/taiatarigame.xcodeproj/project.pbxproj
          
          # メインアプリのバンドルIDのみを確実に置換（衝突回避）
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = jp.soni08.taiatarigame;/g" src/taiatarigame.xcodeproj/project.pbxproj

          # 各種plistファイルのパスを設定
          INFO_PLIST="src/taiatarigame/Info.plist"

          # 1. バージョン情報を 1.0.1、ビルド番号をGitHubのアクション実行番号（重複回避）に更新
          plutil -replace CFBundleShortVersionString -string "1.0.1" "$INFO_PLIST"
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$INFO_PLIST"

          # 2. iPadマルチタスク用の画面の向き（4方向）を強制追加
          plutil -replace UISupportedInterfaceOrientations -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$INFO_PLIST"
          plutil -replace UISupportedInterfaceOrientations~ipad -xml "<array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>" "$INFO_PLIST"

      # 5. Xcodeアーカイブの作成（ビルド実行）
      - name: Build Xcode Archive
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace src/taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID $KEY_ID \
                     -authenticationKeyIssuerID $ISSUER_ID \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
                     CODE_SIGN_STYLE="Automatic" \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0

      # 6. 自動署名用の ExportOptions.plist を新規作成
      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > src/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>JACG2JJ596</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      # 7. IPAファイルの書き出し（パッケージ化）
      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportPath build/exported \
                     -exportOptionsPlist src/exportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID $KEY_ID \
                     -authenticationKeyIssuerID $ISSUER_ID \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
                     CODE_SIGN_STYLE="Automatic" \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0

      # 8. TestFlight (App Store Connect) へアップロード
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file build/exported/taiatarigame.ipa \
                       --apiKey $KEY_ID \
                       --apiIssuer $ISSUER_ID
