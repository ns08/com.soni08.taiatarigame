name: Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js環境のセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: npm ci

      # 4. Webアプリ（PWA）のビルド
      - name: Build Web App
        run: npm run build

      # 5. Capacitorの同期 (iOSプロジェクトがない場合は自動生成されます)
      - name: Capacitor Sync
        run: |
          npx cap sync ios

      # 6. App Store Connect APIキーの配置
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 7. CocoaPodsの依存関係インストール (Capacitorが生成したiosフォルダに対して実行)
      - name: Install Pods
        run: |
          cd ios/App
          pod install
          cd ../..

      # 8. Xcodeアーカイブの作成（ビルド実行）
      - name: Build Xcode Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 9. IPAファイルの書き出し（既存の exportOptions.plist を使用）
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportPath build/exported \
                     -exportOptionsPlist exportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
                     -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # 10. TestFlight (App Store Connect) へアップロード
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file build/exported/App.ipa \
                       --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
                       --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
