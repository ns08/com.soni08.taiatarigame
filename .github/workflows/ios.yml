name: iOS Build and Upload to App Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Dependencies (CocoaPods)
        run: |
          cd src
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Set up App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Detect Workspace or Project
        id: detect-build-file
        run: |
          cd src
          if [ "$(ls -A | grep -i '\.xcworkspace$')" ]; then
            echo "filetype=workspace" >> $GITHUB_OUTPUT
            echo "filename=$(ls -A | grep -i '\.xcworkspace$')" >> $GITHUB_OUTPUT
          else
            echo "filetype=project" >> $GITHUB_OUTPUT
            echo "filename=$(ls -A | grep -i '\.xcodeproj$')" >> $GITHUB_OUTPUT
          fi

      - name: Build and Archive for iOS Device
        run: |
          set -o pipefail
          cd src
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo "Using scheme: $scheme"

          xcodebuild -${{ steps.detect-build-file.outputs.filetype }} "${{ steps.detect-build-file.outputs.filename }}" \
            -scheme "$scheme" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            clean archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CODE_SIGN_STYLE="Automatic" \
            DEVELOPMENT_TEAM="JACG2JJ596" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee xcodebuild.log

      - name: Export IPA
        run: |
          cd src
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee export.log

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/*.ipa" \
            -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --output-format json

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/xcodebuild.log
            src/export.log
