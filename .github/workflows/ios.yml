name: Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      # 1. コードのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. App Store Connect APIキーの配置
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # 3. CocoaPodsの依存関係インストール
      - name: Install Pods
        run: |
          pod install
        working-directory: ./src

      # 4. Xcodeアーカイブの作成（ビルド実行）
      # ビルド前に、プロジェクト設定ファイル内のチームID（空白部分）を直接上書き置換します
      - name: Build Xcode Archive
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: "あなたのチームID（10桁の英数字）" # ここにご自身のチームIDを入力してください
        run: |
          # プロジェクトファイル内の DevelopmentTeam 設定を直接書き換える（力技での上書き）
          sed -i '' "s/DevelopmentTeam = \"\";/DevelopmentTeam = ${TEAM_ID};/g" src/taiatarigame.xcodeproj/project.pbxproj
          sed -i '' "s/DevelopmentTeam = .*/DevelopmentTeam = ${TEAM_ID};/g" src/taiatarigame.xcodeproj/project.pbxproj

          xcodebuild -workspace src/taiatarigame.xcworkspace \
                     -scheme taiatarigame \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID $KEY_ID \
                     -authenticationKeyIssuerID $ISSUER_ID \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
                     CODE_SIGN_STYLE="Automatic" \
                     DEVELOPMENT_TEAM="$TEAM_ID"

      # 5. IPAファイルの書き出し（パッケージ化）
      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: "JACG2JJ596" # ここにもご自身のチームIDを入力してください
        run: |
          xcodebuild -exportArchive \
                     -archivePath build/App.xcarchive \
                     -exportPath build/exported \
                     -exportOptionsPlist src/exportOptions.plist \
                     -allowProvisioningUpdates \
                     -authenticationKeyID $KEY_ID \
                     -authenticationKeyIssuerID $ISSUER_ID \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
                     CODE_SIGN_STYLE="Automatic" \
                     DEVELOPMENT_TEAM="$TEAM_ID"

      # 6. TestFlight (App Store Connect) へアップロード
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file build/exported/taiatarigame.ipa \
                       --apiKey $KEY_ID \
                       --apiIssuer $ISSUER_ID
