name: Build iOS App (TaiatariGame)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and Sign iOS App
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 一時的なキーチェーンを作成
      - name: Set up keychain
        run: |
          keychain_path=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "" "$keychain_path"
          echo "KEYCHAIN_PATH=$keychain_path" >> $GITHUB_ENV

      # 2. GitHub Secretsから証明書を復元してインポート
      - name: Import Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
        run: |
          cert_path=$RUNNER_TEMP/build_certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"

          security import "$cert_path" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-todo:,apple: -s -k "" "$KEYCHAIN_PATH"

      # 3. プロビジョニングプロファイルをインストール
      - name: Import Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          profile_path=$RUNNER_TEMP/build_profile.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profile_path"

          uuid=$(grep -a -A 1 '<key>UUID</key>' "$profile_path" | tail -n 1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      # 4. 手動署名（Manual）を指定したXcodeビルドの実行
      - name: Build Xcode Project
        run: |
          xcodebuild -project src/taiatarigame.xcodeproj \
                     -scheme taiatarigame \
                     -sdk iphoneos \
                     -configuration Release \
                     archive \
                     -archivePath $RUNNER_TEMP/taiatarigame.xcarchive \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="com.soni08.taiatarigame" \
                     DEVELOPMENT_TEAM="JACG2JJ596"
